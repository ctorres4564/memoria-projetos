name: Registrar memória do projeto

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  registrar-memoria:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Registrar alterações
        shell: bash
        run: |
          DATA=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT="${{ github.event.head_commit.message }}"
          AUTOR="${{ github.event.head_commit.author.name }}"

          {
            echo ""
            echo "## $DATA"
            echo ""
            echo "- Commit: $COMMIT"
            echo "- Autor: $AUTOR"
            echo "- Arquivos alterados:"
            git diff --name-only HEAD^ HEAD | sed 's/^/  - /'
          } >> "Diário Automático.md"

      - name: Salvar registro
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Diário Automático.md"

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para registrar."
            exit 0
          fi

          git commit -m "docs: atualizar diário automático"
          git push